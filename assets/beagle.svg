<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Illustration of a Beagle">
  <title>Illustration of a Beagle</title>
  <!-- background -->
  <rect width="200" height="200" rx="16" fill="#eaf4fa"/>
  <!-- body -->
  <ellipse cx="100" cy="132" rx="46" ry="34" fill="#c98a4b"/>
  <!-- white chest -->
  <ellipse cx="100" cy="146" rx="26" ry="20" fill="#f5ead8"/>
  <!-- legs -->
  <rect x="70" y="158" width="12" height="24" rx="6" fill="#b1743a"/>
  <rect x="118" y="158" width="12" height="24" rx="6" fill="#b1743a"/>
  <!-- head -->
  <circle cx="100" cy="78" r="38" fill="#c98a4b"/>
  <!-- muzzle -->
  <ellipse cx="100" cy="94" rx="22" ry="16" fill="#f5ead8"/>
  <!-- nose -->
  <ellipse cx="100" cy="88" rx="7" ry="5" fill="#3b2b20"/>
  <!-- mouth -->
  <path d="M100 93 v8 M100 101 q-8 6 -13 1 M100 101 q8 6 13 1" stroke="#3b2b20" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="86" cy="70" r="4.5" fill="#2a2018"/>
  <circle cx="114" cy="70" r="4.5" fill="#2a2018"/>
  <!-- floppy ears -->
  <ellipse cx="64" cy="86" rx="12" ry="26" fill="#a9622c" transform="rotate(12 64 86)"/>
  <ellipse cx="136" cy="86" rx="12" ry="26" fill="#a9622c" transform="rotate(-12 136 86)"/>
  <!-- tail -->
  <path d="M146 122 q22 -6 24 -26" stroke="#c98a4b" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- eyebrow patches -->
  <ellipse cx="86" cy="60" rx="7" ry="4" fill="#f5ead8"/>
  <ellipse cx="114" cy="60" rx="7" ry="4" fill="#f5ead8"/>
</svg>
